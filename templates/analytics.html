
{% extends "base.html" %}

{% block content %}

<div class="container-fluid">

    <h3 class="mb-2">Performance Analytics</h3>

    <p class="text-muted mb-4">
        Analyze student results and subject-wise performance.
    </p>


    <!-- Subject Performance Chart -->

    <div class="row">

        <div class="col-md-7">

            <div class="dashboard-card">

                <h5 class="mb-4">Subject-wise Average Marks</h5>

                <canvas id="subjectChart"></canvas>

            </div>

        </div>


        <!-- Grade Distribution -->

        <div class="col-md-5">

            <div class="dashboard-card">

                <h5 class="mb-4">Grade Distribution</h5>

                <canvas id="gradeChart"></canvas>

            </div>

        </div>

    </div>


    <!-- Student Comparison -->

    <div class="row mt-4">

        <div class="col-md-12">

            <div class="dashboard-card">

                <h5 class="mb-4">Student Performance Comparison</h5>

                <canvas id="studentChart"></canvas>

            </div>

        </div>

    </div>

</div>


<script>

const subjects = {{ subjects | tojson }};

const averages = {{ subject_averages | tojson }};

const grades = {{ grade_counts | tojson }};

const studentNames = {{ student_names | tojson }};

const studentPercentages = {{ student_percentages | tojson }};


// Subject Chart

new Chart(document.getElementById("subjectChart"), {

    type: "bar",

    data: {

        labels: subjects,

        datasets: [{

            label: "Average Marks",

            data: averages,

            backgroundColor: "#2563eb",

            borderRadius: 6

        }]

    },

    options: {

        responsive: true,

        scales: {

            y: {

                beginAtZero: true,

                max: 100

            }

        }

    }

});


// Grade Chart

new Chart(document.getElementById("gradeChart"), {

    type: "doughnut",

    data: {

        labels: Object.keys(grades),

        datasets: [{

            data: Object.values(grades),

            backgroundColor: [
                "#2563eb",
                "#16a34a",
                "#f59e0b",
                "#9333ea",
                "#ef4444",
                "#64748b"
            ]

        }]

    },

    options: {

        responsive: true

    }

});


// Student Comparison Chart

new Chart(document.getElementById("studentChart"), {

    type: "line",

    data: {

        labels: studentNames,

        datasets: [{

            label: "Student Percentage",

            data: studentPercentages,

            borderColor: "#2563eb",

            backgroundColor: "rgba(37, 99, 235, 0.15)",

            fill: true,

            tension: 0.3

        }]

    },

    options: {

        responsive: true,

        scales: {

            y: {

                beginAtZero: true,

                max: 100

            }

        }

    }

});

</script>

{% endblock %}
