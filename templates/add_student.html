
{% extends "base.html" %}

{% block content %}

<div class="container-fluid">

    <h3 class="mb-2">Add New Student</h3>
    <p class="text-muted mb-4">Enter student details and subject marks.</p>

    <div class="form-container">

        <form action="/add-student" method="POST">

            <h5 class="mb-3">Student Information</h5>

            <div class="row">

                <div class="col-md-6 mb-3">
                    <label class="form-label">Student Name</label>
                    <input type="text" name="name" class="form-control"
                           placeholder="Enter student name" required>
                </div>

                <div class="col-md-6 mb-3">
                    <label class="form-label">Roll Number</label>
                    <input type="text" name="roll_number" class="form-control"
                           placeholder="Enter roll number" required>
                </div>

            </div>

            <hr>

            <h5 class="mb-3">Subject Marks</h5>

            <p class="text-muted">Enter marks out of 100.</p>

            <div class="row">

                <div class="col-md-4 mb-3">
                    <label class="form-label">English</label>
                    <input type="number" name="english" class="form-control"
                           min="0" max="100" required>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Python</label>
                    <input type="number" name="python" class="form-control"
                           min="0" max="100" required>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Mathematics</label>
                    <input type="number" name="maths" class="form-control"
                           min="0" max="100" required>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">DBMS</label>
                    <input type="number" name="dbms" class="form-control"
                           min="0" max="100" required>
                </div>

                <div class="col-md-4 mb-3">
                    <label class="form-label">Java</label>
                    <input type="number" name="java" class="form-control"
                           min="0" max="100" required>
                </div>

            </div>

            <hr>

            <button type="submit" class="btn btn-primary">
                Save Student Marks
            </button>

            <button type="reset" class="btn btn-secondary">
                Clear Form
            </button>

        </form>

    </div>

</div>

{% endblock %}
